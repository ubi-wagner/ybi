name: ci

# One change ran this three times: the push to the working branch, the
# pull_request event for the same commit, and the merge commit on main. Two of
# those three test the identical tree. The pull request is where a change is
# read, and main is what deploys, so those are the two that run — a push to a
# working branch is covered by its own pull request.
#
# The suite itself has no hot spot to cut: 1,568 tests in 70 seconds against
# the empty database CI builds, and the slowest is 7 seconds. What made the
# run feel long was running it three times.
on:
  push:
    branches: [main]
  pull_request:

# A second push while the first run is still going makes the first run's
# answer about a tree nobody will merge. Cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ybi_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ybi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # The schema is the design document, so the tests that read it need it
      # applied. test_vocab.py and test_reconcile_db.py skip themselves when
      # DATABASE_URL is unset — which would be a quiet pass over the
      # constraints and triggers that carry most of the invariants — so CI
      # gives them a real database rather than letting them opt out.
      - name: apply migrations
        run: |
          python -c "
          from app.db import open_pool, run_migrations
          open_pool()
          print('applied:', ', '.join(run_migrations()))
          "

      - run: pytest -q
